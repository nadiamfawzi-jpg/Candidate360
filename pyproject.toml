[project]
name = "ai-interview-coach-2026"
version = "1.0.0"
description = "CV and job-aware interview practice with API coaching and evaluated visual models"
requires-python = ">=3.11,<3.13"
dependencies = [
  "streamlit>=1.40",
  "openai>=1.30",
  "python-dotenv",
  "pandas",
  "numpy<2",
  "pypdf",
  "python-docx",
  "transformers",
  "tensorflow",
  "torch",
  "torchaudio",
  "soundfile",
  "ultralytics",
  "opencv-python-headless",
  "mediapipe==0.10.21",
]

[tool.uv]
package = false
